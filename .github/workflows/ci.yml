name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-tests:
    name: Tests (native macOS, host-less)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project NSMutableNumber.xcodeproj \
            -scheme NSMutableNumber-macOS \
            -destination 'platform=macOS'

  ios-tests:
    name: Tests (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available \
            | grep -E "iPhone|iPad" \
            | grep -oE "[0-9A-F-]{36}" | head -1)
          echo "Using simulator: $DEVICE_ID"
          xcodebuild test \
            -project NSMutableNumber.xcodeproj \
            -scheme NSMutableNumber-iOS \
            -destination "platform=iOS Simulator,id=$DEVICE_ID"

  x86-tests:
    name: Tests (macOS x86_64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rosetta
        # macos-15 runners are Apple Silicon; the x86_64 test bundle runs under Rosetta.
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Run unit tests (x86_64)
        run: |
          set -o pipefail
          xcodebuild test \
            -project NSMutableNumber.xcodeproj \
            -scheme NSMutableNumber-macOS \
            -destination 'platform=macOS,arch=x86_64'

  address-sanitizer:
    name: Tests under AddressSanitizer (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests with ASan
        run: |
          set -o pipefail
          xcodebuild test \
            -project NSMutableNumber.xcodeproj \
            -scheme NSMutableNumber-macOS \
            -destination 'platform=macOS' \
            -enableAddressSanitizer YES

  swiftpm-build:
    name: SwiftPM build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the SwiftPM package
        run: swift build

  xcode-27:
    # The macos-15 jobs above pin an older Xcode. This job builds with the newest Xcode on
    # the runner (Xcode 27 on the xcode-27 image) so SDK changes that raise the minimum
    # deployment target, or new diagnostics, are caught before users report them.
    name: Tests (Xcode 27, macOS + iOS Simulator + SwiftPM + CocoaPods lint)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select the newest Xcode on the runner
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      - name: Run unit tests (macOS)
        run: |
          set -o pipefail
          xcodebuild test \
            -project NSMutableNumber.xcodeproj \
            -scheme NSMutableNumber-macOS \
            -destination 'platform=macOS'

      - name: Run unit tests (iOS Simulator)
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available \
            | grep -E "iPhone|iPad" \
            | grep -oE "[0-9A-F-]{36}" | head -1)
          echo "Using simulator: $DEVICE_ID"
          xcodebuild test \
            -project NSMutableNumber.xcodeproj \
            -scheme NSMutableNumber-iOS \
            -destination "platform=iOS Simulator,id=$DEVICE_ID"

      - name: Build the SwiftPM package
        run: swift build

      - name: Lint the podspec
        run: pod lib lint NSMutableNumber.podspec --skip-tests --platforms=macos,ios
